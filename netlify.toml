[build]
  publish = "."
  command = ""
  ignore = "exit 0"

[build.environment]
  NPM_FLAGS = "--ignore-scripts"
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
